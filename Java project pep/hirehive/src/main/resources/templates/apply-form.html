<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Apply for Job</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 30px;
        }
        .container {
            width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px #ddd;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        label { font-weight: bold; }
        button {
            background: #28a745;
            padding: 10px 15px;
            color: white;
            border: none;
            border-radius: 5px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #218838; }
    </style>
</head>

<body>
<div class="container">
    <h2>Apply for Job</h2>

    <!-- Job Title -->
    <p><strong>Job:</strong> <span th:text="${job.title}"></span></p>

    <form th:action="@{/submit-application}" method="post" enctype="multipart/form-data">

        <!-- Hidden Job ID -->
        <input type="hidden" name="jobId" th:value="${job.id}"/>

        <!-- Name -->
        <label>Your Name</label>
        <input type="text" name="applicantName"
               th:value="${user != null ? user.name : ''}"
               required/>

        <!-- Email -->
        <label>Email</label>
        <input type="email" name="email"
               th:value="${user != null ? user.email : ''}"
               required/>

        <!-- Phone -->
        <label>Phone</label>
        <input type="text" name="phone" required/>

        <!-- Cover Letter -->
        <label>Cover Letter</label>
        <textarea name="coverLetter" rows="4"></textarea>

        <!-- Resume Upload -->
        <label>Upload Resume (PDF)</label>
        <input type="file" name="resume" accept=".pdf" required/>

        <button type="submit">Submit Application</button>
    </form>
</div>
</body>
</html>
