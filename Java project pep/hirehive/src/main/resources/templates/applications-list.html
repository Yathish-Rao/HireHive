<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Applications</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
        }
        th { background: #f5f5f5; }
    </style>
</head>

<body>

<h2>Applications for <span th:text="${job.title}"></span></h2>

<table>
    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Cover Letter</th>
        <th>Resume</th>
    </tr>

    <tr th:each="app : ${applications}">
        <td th:text="${app.applicantName}"></td>
        <td th:text="${app.email}"></td>
        <td th:text="${app.phone}"></td>
        <td th:text="${app.coverLetter}"></td>
        <td>
            <a th:href="@{/${app.resumeLink}}" target="_blank">Download Resume</a>
        </td>
    </tr>

</table>

</body>
</html>
