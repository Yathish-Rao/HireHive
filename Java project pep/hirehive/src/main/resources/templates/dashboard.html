<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>HireHive - Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e1e1e, #2c2c2c);
            color: white;
        }

        .navbar {
            background: #1a1a1a;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: #f5b942;
            text-decoration: none;
            margin-left: 15px;
        }

        .container {
            padding: 40px;
            text-align: center;
        }

        .card {
            background: #2b2b2b;
            padding: 30px;
            border-radius: 12px;
            margin: 20px auto;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .btn {
            display: inline-block;
            padding: 12px 20px;
            margin: 10px;
            background: #f5b942;
            color: black;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .btn:hover {
            background: #e0a72f;
        }
    </style>
</head>

<body>

<div class="navbar">
    <div><strong>HireHive</strong></div>
    <div>
        <a href="/dashboard">Dashboard</a>
        <a href="/jobs">Jobs</a>
        <a href="/post-job" sec:authorize="hasRole('EMPLOYER')">Post Job</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<div class="container">
    <h1>Welcome 👋</h1>
    <p th:text="HireHive"></p>

    <div class="card">
        <h3>Explore Opportunities</h3>
        <a href="/jobs" class="btn">View Jobs</a>
    </div>

    <div class="card" sec:authorize="hasRole('EMPLOYER')">
        <h3>Post New Job</h3>
        <a href="/post-job" class="btn">Post Job</a>
    </div>
</div>

</body>
</html>
